<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Pulkit Giddu  Software Engineer">
  <defs>
    <!-- Visual tokens
         --ink: #0B0F14
         --slate: #121821
         --mist: #8B95A5
         --paper: #E9EEF5
         --signal: #5EEAD4
         --signal-dim: #2A9B8A
         --warm: #E8C07A
    -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#0B1418"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#2A9B8A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5EEAD4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="460" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#glow)"/>
    <rect width="1200" height="460" fill="url(#glow2)"/>
    <rect width="1200" height="460" fill="url(#grid)"/>

    <!-- Soft diagonal atmosphere band -->
    <path d="M0 320 Q420 240 720 300 T1200 220 L1200 460 L0 460 Z" fill="#5EEAD4" opacity="0.035"/>

    <!-- Animated scan line -->
    <rect x="0" y="0" width="1200" height="64" fill="url(#scan)" opacity="0.7">
      <animate attributeName="y" values="-64;460;-64" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Top rule -->
    <rect x="72" y="48" width="120" height="2" fill="#5EEAD4" opacity="0.85"/>
    <text x="208" y="54" fill="#8B95A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">PROFILE / 2026</text>

    <!-- Brand -->
    <text x="72" y="168" fill="#E9EEF5" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Pulkit Giddu</text>

    <!-- Supporting line + blink cursor -->
    <text x="72" y="220" fill="#A8B2C1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Payments at HSBC. Products of my own.</text>
    <rect x="548" y="202" width="2" height="22" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Role chip row (flat, not pill-walls) -->
    <text x="72" y="278" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5">SOFTWARE ENGINEER  ·  HSBC  ·  PUNE</text>

    <!-- Short bio -->
    <text x="72" y="322" fill="#8B95A5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
      Distributed payment systems by day. Shipping Wynklo and other products by choice.
    </text>

    <!-- Accent corner mark -->
    <path d="M1080 380 L1128 380 L1128 428" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.55"/>
    <circle cx="1128" cy="380" r="3" fill="#5EEAD4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
